name: deeix-chat-local

services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: deeix-chat:local
    container_name: deeix-chat-app-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3700:8080"
    volumes:
      - ./data/storage:/app/storage
      - ./data/app:/app/data
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deeix-chat

  postgres:
    image: pgvector/pgvector:pg16
    container_name: deeix-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deeix_chat
      # 本地验证专用，禁止用于生产；生产口令由 1Panel/secret 管理
      POSTGRES_PASSWORD: deeix_chat_change_me
      POSTGRES_DB: deeix_chat
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - deeix-chat

  redis:
    image: redis:7-bookworm
    container_name: deeix-chat-redis
    restart: unless-stopped
    # 本地验证专用，禁止用于生产；生产口令由 1Panel/secret 管理
    command: ["redis-server", "--requirepass", "deeix_chat_change_me"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      # 本地验证专用，禁止用于生产；生产口令由 1Panel/secret 管理
      REDIS_PASSWORD: deeix_chat_change_me
    networks:
      - deeix-chat

volumes: {}

networks:
  deeix-chat:
    name: deeix-chat-network
